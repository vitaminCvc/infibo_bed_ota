<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>自定义方案保存交互预览</title>
    <style>
      :root {
        color-scheme: dark;
        --page: #15171b;
        --panel: #24272d;
        --surface: #1d2025;
        --line: #494f59;
        --text: #f2f4f7;
        --muted: #aeb5bf;
        --blue: #2678e8;
        --blue-hover: #3887ee;
        --warning: #e6ab45;
        --danger: #ef766e;
        --success: #50c78c;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--page);
        color: var(--text);
        font-family: "Microsoft YaHei", system-ui, sans-serif;
      }
      .preview {
        width: min(880px, calc(100vw - 32px));
        min-height: 560px;
        padding: 28px;
        background: #1b1e23;
        border: 1px solid #353a43;
        border-radius: 8px;
      }
      .toolbar, .card-title, .dialog-actions, .status-row {
        display: flex;
        align-items: center;
      }
      .toolbar { justify-content: space-between; gap: 16px; }
      h1 { margin: 0; font-size: 22px; font-weight: 600; }
      .scenario { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; }
      select, input {
        background: var(--surface);
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 5px;
        font: inherit;
      }
      select { padding: 8px 10px; }
      .plan-card {
        margin-top: 38px;
        padding: 24px;
        background: var(--panel);
        border: 1px solid #343943;
        border-radius: 8px;
      }
      .card-title { justify-content: space-between; }
      .plan-name { font-size: 20px; font-weight: 600; }
      .plan-meta { margin-top: 10px; color: var(--muted); font-size: 14px; }
      .save-plan {
        display: block;
        width: min(451px, 100%);
        height: 56px;
        margin: 64px auto 0;
        border: 0;
        border-radius: 6px;
        background: var(--blue);
        color: white;
        font: inherit;
        font-size: 20px;
        font-weight: 600;
        cursor: pointer;
      }
      button:not(:disabled):hover { background: var(--blue-hover); }
      button:disabled { cursor: default; opacity: 0.52; }
      .mask {
        position: fixed;
        inset: 0;
        display: none;
        place-items: center;
        background: rgb(0 0 0 / 58%);
      }
      .mask.open { display: grid; }
      .dialog {
        width: min(390px, calc(100vw - 32px));
        min-height: 264px;
        padding: 28px 25px 22px;
        background: #202127;
        border: 1px solid #505663;
        border-radius: 8px;
        box-shadow: 0 18px 40px rgb(0 0 0 / 36%);
      }
      .dialog h2 { margin: 0 0 24px; font-size: 22px; font-weight: 600; }
      input { width: 100%; height: 58px; padding: 0 14px; font-size: 17px; }
      input:disabled { opacity: 0.52; }
      .status-row {
        min-height: 30px;
        gap: 9px;
        margin-top: 13px;
        color: var(--muted);
        font-size: 14px;
      }
      .status-row.warning { color: var(--warning); }
      .status-row.failure { color: var(--danger); }
      .status-row.success { color: var(--success); }
      .spinner {
        width: 17px;
        height: 17px;
        flex: none;
        border: 2px solid rgb(255 255 255 / 28%);
        border-top-color: var(--blue-hover);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .dialog-actions { justify-content: flex-end; gap: 12px; margin-top: 20px; }
      .dialog-actions button {
        width: 88px;
        height: 40px;
        border: 0;
        border-radius: 5px;
        color: white;
        font: inherit;
        cursor: pointer;
      }
      .cancel { background: #656d78; }
      .confirm { background: var(--blue); }
      .cancel:not(:disabled):hover { background: #777f8b; }
      .complete-note { margin-top: 22px; text-align: center; color: var(--success); font-size: 15px; }
      @media (max-width: 560px) {
        .preview { padding: 20px; }
        .toolbar { align-items: flex-start; flex-direction: column; }
      }
    </style>
  </head>
  <body>
    <main class="preview">
      <div class="toolbar">
        <h1>自定义方案编辑</h1>
        <label class="scenario">
          模拟结果
          <select id="scenario">
            <option value="success">正常保存</option>
            <option value="slow-success">5 秒后成功</option>
            <option value="failure">保存失败</option>
          </select>
        </label>
      </div>
      <section class="plan-card" aria-label="已编辑的方案">
        <div class="card-title">
          <span class="plan-name">肩颈舒缓方案</span>
          <span>已保存参数</span>
        </div>
        <p class="plan-meta">30 分钟 · 红光 · PEMF · 分子氢</p>
      </section>
      <button class="save-plan" id="open-dialog">保存方案</button>
      <p class="complete-note" id="complete-note" hidden>方案已保存</p>
    </main>

    <div class="mask" id="mask" role="presentation">
      <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
        <h2 id="dialog-title">方案命名</h2>
        <input id="name" value="肩颈舒缓方案" aria-label="方案名称">
        <div class="status-row" id="status" aria-live="polite"></div>
        <div class="dialog-actions">
          <button class="cancel" id="cancel">取消</button>
          <button class="confirm" id="confirm">保存</button>
        </div>
      </section>
    </div>

    <script>
      const elements = {
        mask: document.querySelector('#mask'),
        scenario: document.querySelector('#scenario'),
        name: document.querySelector('#name'),
        status: document.querySelector('#status'),
        cancel: document.querySelector('#cancel'),
        confirm: document.querySelector('#confirm'),
        open: document.querySelector('#open-dialog'),
        completeNote: document.querySelector('#complete-note'),
      };
      let saving = false;
      let slowTimer;
      let resultTimer;

      function setControlsDisabled(disabled) {
        elements.name.disabled = disabled;
        elements.cancel.disabled = disabled;
        elements.confirm.disabled = disabled;
      }

      function setStatus(type, message, spinning) {
        elements.status.className = `status-row ${type || ''}`;
        elements.status.innerHTML = `${spinning ? '<span class="spinner" aria-hidden="true"></span>' : ''}<span>${message || ''}</span>`;
      }

      function resetDialog() {
        clearTimeout(slowTimer);
        clearTimeout(resultTimer);
        saving = false;
        setControlsDisabled(false);
        setStatus('', '', false);
      }

      function closeDialog() {
        resetDialog();
        elements.mask.classList.remove('open');
      }

      function finishSuccess() {
        if (!saving) return;
        saving = false;
        clearTimeout(slowTimer);
        setStatus('success', '保存成功', false);
        window.setTimeout(() => {
          closeDialog();
          elements.completeNote.hidden = false;
        }, 550);
      }

      function finishFailure() {
        if (!saving) return;
        saving = false;
        clearTimeout(slowTimer);
        setControlsDisabled(false);
        setStatus('failure', '保存失败，请重试', false);
      }

      function submit() {
        if (saving) return;
        if (!elements.name.value.trim()) {
          setStatus('failure', '方案名称不能为空', false);
          return;
        }
        saving = true;
        setControlsDisabled(true);
        setStatus('', '正在保存，请稍后', true);
        slowTimer = window.setTimeout(() => {
          if (saving) setStatus('warning', '保存响应较慢，请稍后', true);
        }, 5000);

        const scenario = elements.scenario.value;
        const delay = scenario === 'success' ? 1300 : 6200;
        resultTimer = window.setTimeout(
          scenario === 'failure' ? finishFailure : finishSuccess,
          delay,
        );
      }

      elements.open.addEventListener('click', () => {
        elements.completeNote.hidden = true;
        resetDialog();
        elements.mask.classList.add('open');
        elements.name.focus();
      });
      elements.cancel.addEventListener('click', closeDialog);
      elements.confirm.addEventListener('click', submit);
    </script>
  </body>
</html>
